name: Run Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # setiap 10 menit

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow curl_cffi

      - name: Run scraper
        env:
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main
        run: |
          python scraper.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output.json thumbs/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update output [skip ci]"
          git push
